<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Create Account</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="login-box"><h2>Create Account 💙</h2><p class="small">Create your own account.</p><form id="registerForm"><label>Email</label><input id="registerEmail" type="email" required placeholder="Enter your email"><label>Password</label><input id="registerPassword" type="password" required minlength="6" placeholder="At least 6 characters"><label>Confirm Password</label><input id="confirmPassword" type="password" required minlength="6" placeholder="Enter password again"><button class="login-button" type="submit">Create Account</button><p id="registerMessage"></p></form><p class="account-link">Already have an account? <a href="index.html">Login</a></p></div><script src="script.js"></script></body></html>
