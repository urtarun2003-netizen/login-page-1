<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Floating Background Particles -->
    <div class="particles">
        <div class="particle" style="left: 15%; animation-delay: 1s;"></div>
        <div class="particle" style="left: 35%; animation-delay: 5s;"></div>
        <div class="particle" style="left: 65%; animation-delay: 2s;"></div>
        <div class="particle" style="left: 85%; animation-delay: 6s;"></div>
    </div>

    <div id="login-wrapper" class="animate-in">
        <div class="glass-panel">
            <h2>Create Account</h2>
            <p>Join our little world.</p>
            <form id="registerForm">
                <div class="input-group">
                    <label>User ID</label>
                    <input id="registerUserId" type="text" required minlength="3" maxlength="30" autocomplete="username" placeholder="Choose a User ID">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input id="registerPassword" type="password" required minlength="6" placeholder="At least 6 characters">
                </div>
                <div class="input-group">
                    <label>Confirm Password</label>
                    <input id="confirmPassword" type="password" required minlength="6" placeholder="Enter password again">
                </div>
                <button class="btn-primary" type="submit">Create Account</button>
                <p id="registerMessage"></p>
            </form>
            <p class="account-link">Already have an account? <a href="index.html">Login</a></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
