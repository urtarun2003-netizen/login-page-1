<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sad Moments</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-sad">
    <!-- Floating Background Particles -->
    <div class="particles">
        <div class="particle" style="left: 20%; animation-delay: 2s; background: rgba(96, 165, 250, 0.4);"></div>
        <div class="particle" style="left: 60%; animation-delay: 0s; background: rgba(96, 165, 250, 0.4);"></div>
        <div class="particle" style="left: 80%; animation-delay: 4s; background: rgba(96, 165, 250, 0.4);"></div>
    </div>

    <div class="content-wrapper animate-in">
        <div class="page-header">
            <h1>😔 Sad</h1>
            <p>It's okay to have a difficult day. Take your time.</p>
        </div>

        <div class="message-box">
            <h2>❤️ A Message For You</h2>
            <p>It’s okay to be sad sometimes. Just remember, you’re never alone. I’m always here for you. ❤️</p>
        </div>

        <div class="photo-gallery">
            <h2>🖼️ Sad Photos</h2>
            <div class="photo-grid">
                <div class="photo-card">
                    <img src="sad/sad1.jpg" alt="Sad photo">
                </div>
                <div class="photo-card">
                    <img src="sad/sad2.jpg" alt="Sad photo">
                </div>
            </div>
        </div>

        <div style="text-align: center;">
            <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
