<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Moments</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-happy">
    <!-- Floating Background Particles -->
    <div class="particles">
        <div class="particle" style="left: 20%; animation-delay: 2s; background: rgba(250, 204, 21, 0.4);"></div>
        <div class="particle" style="left: 60%; animation-delay: 0s; background: rgba(250, 204, 21, 0.4);"></div>
        <div class="particle" style="left: 80%; animation-delay: 4s; background: rgba(250, 204, 21, 0.4);"></div>
    </div>

    <div class="content-wrapper animate-in">
        <div class="page-header">
            <h1>😊 Happy</h1>
            <p>Keep smiling and enjoy the beautiful moments!</p>
        </div>

        <div class="message-box">
            <h2>💌 A Message For You</h2>
            <p>You make every ordinary day feel special. Keep smiling, because your smile is one of my favorite things in this world. ❤️</p>
        </div>

        <div class="photo-gallery">
            <h2>🖼️ Happy Photos</h2>
            <div class="photo-grid">
                <div class="photo-card">
                    <img src="happy/happy1.jpg" alt="Happy photo">
                </div>
                <div class="photo-card">
                    <img src="happy/happy2.jpg" alt="Happy photo">
                </div>
            </div>
        </div>

        <div style="text-align: center;">
            <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
